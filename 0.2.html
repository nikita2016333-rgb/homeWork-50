<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <link rel="stylesheet" href="style.css" />

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>

    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>

  <body>
    <div id="app"></div>

    <script type="text/babel">
      const container = document.getElementById("app");

      const Header = () => {
        return (
          <header className="header">
            <a href="#">S.T.A.L.K.E.R WIKI</a>
          </header>
        );
      };
      const Sidebar = () => {
        return (
          <div>
            <ul className="list">
              <li>
                <a href="#">Главная</a>
              </li>
              <li>
                <a href="#">Обсуждения</a>
              </li>
              <li>
                <a href="#">Сообщество</a>
              </li>
              <li>
                <a href="#">Игры</a>
              </li>
              <li>
                <a href="#">Новости</a>
              </li>
            </ul>
          </div>
        );
      };

      const Content = () => {
        return (
          <div>
            <h1>S.T.A.L.K.E.R.: Зов Припяти</h1>
            <p className="text-one">
              «S.T.A.L.K.E.R.: Зов Припяти» (рабочее название «S.T.A.L.K.E.R.:
              Тайны Зоны») — компьютерная игра в жанре FPS (First Person
              Shooter) от компании GSC Game World, сиквел к игре
              «S.T.A.L.K.E.R.: Тень Чернобыля». Разработка началась незадолго до
              выпуска «S.T.A.L.K.E.R.: Чистое Небо», 29 августа 2008-го года,
              анонс состоялся 30 апреля 2009-го на официальном сайте игры.
              Первый выпуск игры состоялся 2 октября 2009 года в странах СНГ.
            </p>
            <img
              src="https://i.playground.ru/e/Q2eolUcVaEYGIrrzhsugfg.jpeg"
              alt="Постер игры"
            />{" "}
            <p className="text-two">
              После того как Выжигатель мозгов был отключен и проход к Центру
              Зоны оказался открыт, правительство Украины решает провести
              крупномасштабную военную операцию под кодовым названием
              «Фарватер». Целью операции являлось взятие ЧАЭС под контроль
              военных. Военные составили детальные карты расположения аномальных
              полей, чтобы по безопасному маршруту дойти до ЧАЭС. Вскоре пять
              вертолётов из группы «Скат» с десантом на борту взяли курс на
              станцию. Однако план проваливается: связь с вертолётами пропадает,
              ни один из экипажей не достигает цели и не возвращается на базу.
              Для расследования причин провала операции, Служба Безопасности
              Украины направляет своего оперативника со стажем, в бывшем
              опытного сталкера, майора Александра Дегтярёва в Центр Зоны.
              Первостепенной задачей Дегтярёва является поиск пяти пропавших
              вертолётов, в каждом из которых содержится часть некой важной
              информации. После отключения Выжигателя мозгов группы сталкеров
              начали массово подходить к Центру Зоны. На местности под названием
              Затон (осушенная часть реки Припять) и в окрестностях завода
              «Юпитер» начали образовываться отряды вольных сталкеров и
              бандитов. Экспедиционные отряды «Долга» и «Свободы» также пришли
              на эти территории и борьба между ними продолжилась.
            </p>
            <h1>Официальный список нововведений</h1>
            <ul className="list-changes">
              <li>
                Фотореалистичная Зона отчуждения — воссозданная по реальным
                прототипам.
              </li>
              <li>Новый сюжет, ряд уникальных персонажей.</li>
              <li>Расширенная система побочных квестов.</li>
              <li>
                Новые монстры: химера и бюрер. Новое поведение и способности
                некоторых мутантов.
              </li>
              <li>
                Доработанная система A-Life на основе наиболее понравившихся
                игрокам элементов первых двух игр серии.
              </li>
              <li>Выбросы существенно влияют на мир Зоны.</li>
              <li>В игру добавлена функция сна.</li>
              <li>Новый интерфейс игрока.</li>
              <li>
                Возможность продолжить игру после её прохождения в режиме
                Freeplay (Свободная Игра).
              </li>
              <li>Игра разрабатывалась на движке X-Ray v.1.6</li>
            </ul>
          </div>
        );
      };
      const Footer = () => {
        return (
          <footer className="footer">
            <p>
              S.T.A.L.K.E.R. Wiki: Zone Chronicles — это сообщество Фэндома на
              портале Видеоигры.
            </p>
          </footer>
        );
      };
      const App = () => {
        return (
          <div>
            <Header />
            <div className="block">
              <Sidebar />
              <Content />
            </div>
            <Footer />
          </div>
        );
      };

      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
